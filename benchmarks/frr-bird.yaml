# a set of standard tests
#  to compare outputs a I make changes to bgperf
tests:
  -
     name: baseline-benchmark
     neighbors: [10, 50]
     prefixes: [50_000]
     filter_test: [None]
     targets:
       -
         name: frr_c
         versions: [8.5, 9.1, 10.7]
         tester_type: bird
       -
         name: frr_c
         label: frr master
         tester_type: bird
