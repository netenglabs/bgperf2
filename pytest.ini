[pytest]
# Narrow pytest's default collection patterns so production names are not
# mistaken for tests. `measurements.TesterEventRecorder`/`TesterOffering` and
# `bird.tester_offering`/`measurements.tester_metrics` all begin with "test",
# so the defaults (`test*`, `Test*`) try to collect them the moment a test
# module imports them: the functions are collected as tests and error on their
# missing "fixtures", and the classes raise a collection warning.
#
# `Test[A-Z]*` still matches every real test class in tests/ (TestResolveRef,
# TestGcovPattern, ...) because those capitalise the word after "Test".
# A pattern without glob characters is a *prefix* match in pytest, so `test`
# would re-admit `tester_*`. Everything in tests/ uses `test_`; the one method
# that was named plain `test` was renamed rather than widened for.
python_functions = test_*
python_classes = Test[A-Z]*
