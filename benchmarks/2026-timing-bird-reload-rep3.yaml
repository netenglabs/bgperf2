# Block 10 of the 64 GB timing validation campaign, selection 3 of 3,
# repetition 3 of 3: BIRD policy recalculation. See
# docs/2026-64gb-timing-validation-plan.md, "Block 10: selected repetitions",
# and results/2026/2026-timing-validation/metadata/block10-selection.json,
# which is the decision this file executes.
#
# THE MATRIX IS BLOCK 8'S, UNCHANGED. All three cells of this scenario were
# selected, so unlike the peer sweep nothing is removed here -- benchmarks/2026-timing-bird-reload.yaml
# and this file differ in the test `name` and the `seed` and in nothing else.
# `diff` the `tests:` mapping against it; the headers differ and that is not
# drift. The final report reads the passes as the dispersion of one cell, so any
# drift in the matrix, the workload or the labels between passes is a
# difference in the thing measured arriving inside the statistic meant to
# measure run-to-run noise.
#
# WHY THIS COMPARISON EARNED REPETITIONS.
# `reload_s` 22.44s at 89.3% mean CPU against 12.43s at 40.7%. The measurement
# here is not `elapsed (s)`, so the variance rule says nothing about these
# cells at all -- they are one observation of a number that has no dispersion
# anywhere in this campaign. The 10.0s gap is five times the 2.05s resolution
# of the reload sampler, and the CPU claim is the only "cheaper as well as
# faster" result in the screen, which is precisely Primary Question 10.
#
# ORDER. `order: shuffle` seed 202610 -- the campaign's mechanical year+block
# rule, continuing 20268. All six of this block's configs state that same seed
# and draw different permutations, because `batch_shuffle_key()` digests
# `<seed>:<batch_cell_id(test_name, cell)>` and the test names differ. That is
# also what separates repetition 2 from repetition 3, which differ in `name`
# and in nothing else, so rebuilding either pass's sequence later needs this
# file and not just the number.
tests:
  -
     name: 2026-timing-bird-reload-rep3
     neighbors: [50]
     prefixes: [50_000]
     filter_test: [None]
     policy_reload_blocks: 10
     order: shuffle
     seed: 202610
     targets:
       -
         name: bird
         version: 2.19.2
         label: bird 2.19.2
         tester_type: bird
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2 (default threads)
         tester_type: bird
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2 (4 threads)
         threads: 4
         tester_type: bird
