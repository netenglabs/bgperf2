# a set of standard tests
#  to compare outputs a I make changes to bgperf
tests:
  -
     name: baseline-benchmark
     neighbors: [10, 50, 100]
     prefixes: [20_000, 50_000, 100_000]
     filter_test: [None]
     targets:
       -
         name: frr_c
         # one run per version; each needs `bgperf2.py prepare -t frr_c` first
         versions: [8.5, 9.1, 10.0, 10.7]
         tester_type: bird
       -
         name: frr_c
         label: frr master
         tester_type: bird
       -
         name: bird
         version: 2.19.2
         label: bird 2
         tester_type: bird
       -
         name: bird
         version: 2.19.2
         label: bird 2 -s
         tester_type: bird
         single_table: True
       -
         # bird 3 is the multi-threaded rewrite, but it runs one worker unless
         # told otherwise -- without threads: it benches like bird 2
         name: bird
         version: 3.3.2
         label: bird 3 (4 threads)
         threads: 4
         tester_type: bird
       -
         name: bird
         label: bird master
         tester_type: bird
       -
         name: rustybgp
         tester_type: bird
