# Core 64 GB full-table MRT comparison matrix for open-source targets.
#
# This pins the 2026-08-08 Route Views RIB for reproducibility. If you want a
# fresher August 2026 table, copy this file and update every mrt_file path
# consistently after validating the new dump with bgpdump2 -c.
tests:
  -
     name: 2026-core-mrt
     neighbors: [10]
     prefixes: [1_050_000]
     filter_test: [None]
     targets:
       -
         name: bird
         version: 2.19.2
         label: bird 2.19.2
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2 (default threads)
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2 (4 threads)
         threads: 4
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: bird
         label: bird default
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: frr_c
         versions: [8.5, 9.1, 10.0, 10.7]
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: frr_c
         label: frr default
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: openbgp
         versions: [8.8, 9.2]
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: openbgp
         label: openbgp default
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: rustybgp
         version: 2026-02
         label: rustybgp 2026-02
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: rustybgp
         label: rustybgp default
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
