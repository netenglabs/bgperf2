# Measurement plan 7a, Docker checks 2, 3 and 4 at full table: the core
# matrix's 10-peer 1.05M MRT cell on every open-source target, measured once
# with the GoBGP monitor and once with the sink. Read with
# `scripts/monitor_pair_review.py <results-dir>`, and sample the monitor's CPU
# with `scripts/container_cpu_peak.py bgperf_monitor` for check 4.
#
# Counts and sessions, not timing (7c was to ask that, and was dropped). FRR is expected to fail this
# cell with either instrument -- it exports ~9% less of the table and never
# reaches the check-point (bgperf2-cw6) -- and the review then asks whether the
# two instruments failed it on the same count.
tests:
  -
     name: 2026-monitor-checks-mrt-gobgp
     monitor: gobgp
     neighbors: [10]
     prefixes: [1_050_000]
     filter_test: [None]
     targets: &targets
       -
         name: bird
         version: 2.19.2
         label: bird 2.19.2
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: frr_c
         version: '10.7'
         label: frr_c 10.7
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: rustybgp
         label: rustybgp default
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
       -
         name: openbgp
         version: '9.3'
         label: openbgp 9.3
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
  -
     name: 2026-monitor-checks-mrt-sink
     monitor: sink
     neighbors: [10]
     prefixes: [1_050_000]
     filter_test: [None]
     targets: *targets
