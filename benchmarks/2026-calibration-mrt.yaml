# Phase 6 MRT calibration: the same shape as the campaign's core MRT matrix,
# on one target, so the full-table path is calibrated before 14 of them run.
#
# Peer count and prefix count deliberately match `2026-core-mrt.yaml` rather
# than being reduced. The behaviour this calibrates -- ten injectors replaying
# overlapping MRT peer tables into one target -- is a property of the injector
# count, so a smaller fleet would calibrate a different run.
#
# EXPECTED VERDICT: `tester`, via `tester_limited`. Unlike the synthetic
# generator, bgpdump2 times its own send (`reported_injection_s`), which gives
# the injection/tail boundary a basis the coverage test cannot supply. Measured
# here: the monitor reached the required count 5.9s to 30.3s *before* the last
# injector finished, which is an overlap and is reported as one.
#
# KNOWN FAILURE -- this config fails most of the time (bgperf2-dcs), by design
# of the rule rather than of the target, and that is what it currently
# calibrates.
#
# Measured 2026-09-08: 4 of 5 runs FAILED; a 3-pass batch failed 3 of 3 and
# summary.py published "0 of 3 passes observed". The monitor's count overshoots
# to ~1,072,794 while only 2 of 10 injectors have finished, then declines to
# 1,056,779 as the rest complete. Every run settles on that same 1,056,779, to
# the prefix -- it is the table the target really holds, and the peak is the
# transient. (It is not the configured 1,050,000 and is not meant to be: the
# injectors replay overlapping MRT peer tables, so the union is its own number
# and the check-point is 99% of the configured one.) The decline is 1.49%, against a DROP_FRACTION of 1%; once settled
# the count is flat, so the streak reaches DROP_SAMPLES with no rising sample
# and the run fails. neighbors_checked stays 10 throughout, so the
# flapping-session reset branch is not involved.
#
# A FAILED row from this config is not evidence about the target. Do not raise
# DROP_FRACTION to make it pass -- see the bead.

tests:
  -
     name: 2026-calibration-mrt
     neighbors: [10]
     prefixes: [1_050_000]
     filter_test: [None]
     repetitions: 3
     order: shuffle
     seed: 20260908
     targets:
       -
         name: bird
         version: 3.3.2
         label: bird 3.3.2 (default threads)
         tester_type: bgpdump2
         mrt_file: mrt/rib.20260808.0000
